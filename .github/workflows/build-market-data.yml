name: Build market dataset

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 2 * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e .
      - run: python scripts/build_web_dataset.py
      - name: Commit refreshed market data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/data/tokyo_market.json
          if git diff --cached --quiet; then
            echo 'No market data changes.'
          else
            git commit -m 'data: refresh Tokyo market dataset'
            git push
          fi
